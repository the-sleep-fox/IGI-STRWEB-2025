{% extends 'main/layout.html' %}

{% block title %} Create Review{% endblock %}

{% block content %}
    <div class="features">
        <h1> You can help us be better! Leave your review here! </h1>
        <p> Reviews </p>
        <form method="post">
            {% csrf_token %}
            <input type="text", placeholder="Anons of your review", class="form-control"><br>
            <textarea class="form-control", placeholder="Type your review in detail here"></textarea><br>
            <input type="date", class="form-control"><br>
            <input type="time", class="form-control"><br>
            <buton class="btn btn-success", type="submit"> Post review </buton>
        </form>
    </div>
{% endblock %}
